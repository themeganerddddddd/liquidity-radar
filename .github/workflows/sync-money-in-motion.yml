name: Sync Money in Motion

on:
  schedule:
    - cron: "17 */4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-record-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Sync Chicago Property public records
        run: npm run data:sync-chicago
      - name: Normalize live public transaction sources
        env:
          USPTO_API_KEY: ${{ secrets.USPTO_API_KEY }}
          USPTO_MAX_DOWNLOAD_BYTES: 150000000
          USPTO_MAX_DECOMPRESSED_BYTES: 1250000000
          USPTO_STREAM_CHUNK_BYTES: 1048576
          USPTO_MAX_FILES_PER_RUN: 2
        run: npm run data:sync-motion
      - name: Recompute Seller Intelligence convergence
        env:
          CHICAGO_PROPERTY_RECOMPUTE_ONLY: 1
        run: npm run data:sync-chicago
      - name: Verify money-in-motion contracts
        run: npm run test -- tests/unit/money-in-motion.test.ts tests/unit/chicago-property.test.ts tests/unit/seller-intelligence.test.ts tests/unit/gdelt-client.test.ts tests/unit/uspto-odp.test.ts
      - name: Generate integrity and source-value report
        run: npm run data:report-motion && npm run data:report-sellers
      - name: Commit changed public snapshot
        run: |
          if git diff --quiet -- public/data/money-in-motion-client.json.gz public/data/chicago-property-client.json.gz public/data/chicago-property-source-records.json.gz public/data/chicago-property-sync-state.json.gz public/data/gdelt-sync-state.json public/data/cms-owner-cache.json.gz public/data/stb-sync-state.json public/data/uspto-sync-state.json.gz docs/money-in-motion-validation.md docs/seller-intelligence-validation.md; then
            echo "No source changes."
            exit 0
          fi
          git config user.name "liquidity-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/money-in-motion-client.json.gz public/data/chicago-property-client.json.gz public/data/chicago-property-source-records.json.gz public/data/chicago-property-sync-state.json.gz public/data/gdelt-sync-state.json public/data/cms-owner-cache.json.gz public/data/stb-sync-state.json public/data/uspto-sync-state.json.gz docs/money-in-motion-validation.md docs/seller-intelligence-validation.md
          git commit -m "Refresh Money in Motion snapshot"
          git push origin main

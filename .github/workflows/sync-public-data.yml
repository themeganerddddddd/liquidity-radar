name: Daily public-data sync

on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify SEC contact identity
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::Add the SEC_USER_AGENT repository secret, for example: Liquidity Radar contact@example.com"
            exit 1
          fi
      - name: Refresh official public records
        run: npm run data:sync-public
      - name: Validate the refreshed application
        run: npm run validate
      - name: Detect snapshot changes
        id: snapshot
        shell: bash
        run: |
          if git diff --quiet -- public/data/public-signals.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish refreshed snapshot
        if: steps.snapshot.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/public-signals.json
          git commit -m "Refresh official public-data snapshot"
          git push origin main
